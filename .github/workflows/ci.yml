name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        icet-version: ["patched"]
        include:
          - python-version: "3.12"
            icet-version: "mainline"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (patched icet)
        if: matrix.icet-version == 'patched'
        run: |
          python -m pip install --upgrade pip
          pip install "icet @ git+https://gitlab.com/bjmorgan/icet.git@dea22358301a5949ed5940bab08a8a19240413af"
          pip install -e '.[dev]'
      - name: Install package (mainline icet)
        if: matrix.icet-version == 'mainline'
        run: |
          python -m pip install --upgrade pip
          pip install icet
          pip install -e '.[dev]'
      - name: Run pytest
        run: pytest -q
      - name: Run mypy
        run: mypy
      - name: Run ruff
        run: ruff check .
