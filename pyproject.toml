[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mchammer-pt"
version = "0.26.0"
description = "Replica-exchange orchestrators for mchammer: canonical parallel tempering and multi-walker replica-exchange Wang-Landau"
readme = "README.md"
authors = [
    {name = "Benjamin J. Morgan", email = "b.j.morgan@bath.ac.uk"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "ase",
    "icet>=3.2",
    "h5py",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pandas-stubs",
    "scipy-stubs",
    "mchammer-moves @ git+https://github.com/bjmorgan/mchammer-moves.git@main",
]
plot = ["matplotlib"]

[project.scripts]
mchammer-pt-reweight = "mchammer_pt.cli.reweight:main"
mchammer-pt-reweight-observables = "mchammer_pt.cli.reweight_observables:main"
mchammer-pt-stitch = "mchammer_pt.cli.stitch:main"
mchammer-pt-stitch-observables = "mchammer_pt.cli.stitch_observables:main"
mchammer-pt-coexistence = "mchammer_pt.cli.coexistence:main"
mchammer-pt-reassemble = "mchammer_pt.cli.reassemble:main"

[tool.setuptools.packages.find]
include = ["mchammer_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: integration tests that take minutes (not run by default)",
]

[tool.mypy]
# No `python_version` pin: each CI matrix job (3.11-3.14) runs mypy under its
# own interpreter, so every supported version is type-checked natively (the
# 3.11 job enforces the floor). Pinning to the floor would also force mypy to
# parse third-party stubs as that version, which breaks on stubs using newer
# syntax (e.g. scipy-stubs >= 1.18 uses the 3.12+ PEP 695 `type` alias).
packages = ["mchammer_pt"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["icet", "icet.*", "mchammer", "mchammer.*", "h5py", "h5py.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
