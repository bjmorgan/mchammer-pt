[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mchammer-pt"
version = "0.11.0"
description = "Parallel tempering orchestrator for mchammer canonical Monte Carlo"
readme = "README.md"
authors = [
    {name = "Benjamin J. Morgan", email = "b.j.morgan@bath.ac.uk"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ase",
    # The patched icet fork adds the WL `schedule` parameter, `_phase`,
    # and `_window_entry_step` that mchammer-pt's coordinator reads
    # unconditionally. Mainline icet does not (yet) ship these, so a
    # plain `icet` from PyPI breaks at the first MC step. Track the
    # upstream MR; relax the pin once it lands.
    "icet @ git+https://gitlab.com/bjmorgan/icet.git@master",
    "h5py",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pandas-stubs",
    "mchammer-moves @ git+https://github.com/bjmorgan/mchammer-moves.git@main",
]
plot = ["matplotlib"]

[project.scripts]
mchammer-pt-reweight = "mchammer_pt.cli.reweight:main"

[tool.setuptools.packages.find]
include = ["mchammer_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: integration tests that take minutes (not run by default)",
]

[tool.mypy]
python_version = "3.11"
packages = ["mchammer_pt"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["icet", "icet.*", "mchammer", "mchammer.*", "h5py", "h5py.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
